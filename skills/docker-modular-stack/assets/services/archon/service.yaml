services:
  archon:
    image: ghcr.io/coleam00/archon:latest
    # build: .
    volumes:
      - archon_data:/.archon
    restart: unless-stopped
    environment:
      PORT: "3000"
      ARCHON_DOCKER: "true"
      DATABASE_URL: "postgresql://$DB_USER:$DB_PASSWORD@db:5432/archon"
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
    networks:
      - main
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - db

volumes:
  archon_data: