services:
  analytics_db:
    image: clickhouse/clickhouse-server:25.10.7-alpine
    volumes:
      - analytics_db_data:/var/lib/clickhouse
      - ./init_scripts:/docker-entrypoint-initdb.d
    environment:
      CLICKHOUSE_DB: "${ANALYTICS_DB_NAME:-default}"
      CLICKHOUSE_USER: "${ANALYTICS_DB_USER:-user1}"
      CLICKHOUSE_PASSWORD: "${ANALYTICS_DB_PASSWORD:-password}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://0.0.0.0:8123/ping || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - main
    labels:
      - "layer=data"

volumes:
  analytics_db_data:
