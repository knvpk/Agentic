services:
  grafana:
    image: grafana/grafana:13.1.0-25196703233-ubuntu
    volumes:
      - grafana_data:/var/lib/grafana
      # - ./docker/grafana/config.ini:/etc/grafana/grafana.ini
      - ./config/provisioning:/etc/grafana/provisioning
      - ./config/dashboards:/etc/dashboards
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-Simple123}
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource,redis-datasource,grafana-postgresql-datasource,yesoreyeram-infinity-datasource
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      CLICKHOUSE_PASSWORD: "${ANALYTICS_DB_PASSWORD:-password}"
    networks:
      - main
    labels:
      - "layer=observability"
    depends_on:
      - analytics_db
      - db

  mcp_grafana:
    image: mcp/grafana:latest
    command: ["-t=sse"]
    environment:
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_API_KEY=${GRAFANA_API_KEY}
    networks:
      - main
    labels:
      - "layer=observability"

volumes:
  grafana_data:
