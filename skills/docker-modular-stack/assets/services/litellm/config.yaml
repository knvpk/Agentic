      model: mistral.mistral-7b-instruct-v0:2
      litellm_credential_name: bedrock_personal
    # model_info:
    #   supported_environments: ["development"]
  - model_name: "mistral_8_7b"
    litellm_params:
      model: mistral.mixtral-8x7b-instruct-v0:1
      litellm_credential_name: bedrock_personal
  - model_name: "sonnet_4"
    litellm_params:
      model: anthropic.claude-sonnet-4-20250514-v1:0
      litellm_credential_name: bedrock_personal
  - model_name: "sonnet_3_7"
    litellm_params:
      model: anthropic.claude-3-7-sonnet-20250219-v1:0
      litellm_credential_name: bedrock_personal
  # - model_name: "opus_4"
  #   litellm_params:
  #     model: anthropic.claude-opus-4-20250514-v1:0
  #     litellm_credential_name: bedrock_personal
  - model_name: "llama3_70b"
    litellm_params:
      model: meta.llama3-70b-instruct-v1:0
      litellm_credential_name: bedrock_personal
  - model_name: "llama3_8b"
    litellm_params:
      model: meta.llama3-8b-instruct-v1:0
      litellm_credential_name: bedrock_personal
  - model_name: "gpt_4"
    litellm_params:
      model: openai/gpt-4.1-2025-04-14
      litellm_credential_name: openai_personal
  # - model_name: "qwen_7b"
  #   litellm_params:
  #     model: deepseek-llm-r1-distill-qwen-7b
  #     litellm_credential_name: bedrock_personal
  # - model_name: "qwen_7b"
  #   litellm_params:
  #     model: deepseek-llm-r1-distill-qwen-7b
  #     litellm_credential_name: bedrock_personal
  - model_name: "sample"
    litellm_params:
      model: openai/tensorzero::function_name::sample
      litellm_credential_name: tensorzero
  - model_name: "gemini"
    litellm_params:
      model: gemini/gemini-pro
      litellm_credential_name: google_personal
  - model_name: "gemma3n"
    litellm_params:
      model: ollama/gemma3n
      litellm_credential_name: ollama_local

  - model_name: anthropic-claude
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-3-5-sonnet-20241022
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022

  - model_name: claude-3-5-haiku-20241022
    litellm_params:
      model: anthropic/claude-3-5-haiku-20241022


credential_list:
  - credential_name: bedrock_personal
    credential_values:
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      # aws_region: os.environ/AWS_REGION
      # aws_profile_name: os.environ/AWS_PROFILE
    credential_info:
      description: "Default AWS profile for Bedrock models"
  - credential_name: openai_personal
    credential_values:
      api_key: "os.environ/OPENAI_API_KEY"
      api_base: "https://api.openai.com/v1"
    credential_info:
      description: "Chat gpt subscription from Personal account"
  - credential_name: tensorzero
    credential_values:
      api_key: "Dummy"
      api_base: "http://tensorzero_gw:3000/openai/v1"
    credential_info:
      description: "Local tensorzero gateway"
  - credential_name: google_personal
    credential_values:
      api_key: "os.environ/GOOGLE_API_KEY"
    credential_info:
      description: "Personal google gemini account"
  - credential_name: ollama_local
    credential_values:
      api_base: "http://ollama:11434"
    credential_info:
      description: "Local Ollama instance for Gemma3N model"

litellm_settings:
  callbacks: ["otel"]
  drop_params: True
  max_budget: 20
  budget_duration: 30d
  num_retries: 5
  request_timeout: 600
  telemetry: False
  cache: True
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    namespace: "litellm.caching"

callback_settings:
  otel:
    message_logging: True

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: True
  store_prompts_in_spend_logs: True
  proxy_budget_rescheduler_min_time: 60
  proxy_budget_rescheduler_max_time: 64
  proxy_batch_write_at: 1
  database_connection_pool_limit: 10
  database_url: os.environ/DATABASE_URL
  forward_client_headers_to_llm_api: true
