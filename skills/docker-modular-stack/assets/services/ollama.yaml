

services:
  ollama:
    image: ollama/ollama:0.22.1
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - main
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: ollama
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ollama list || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  ollama_data:
