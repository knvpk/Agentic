
services:
  db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-user1}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-ds}
      ADDITIONAL_DBS: kestra
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./config/multiple-databases.sh:/docker-entrypoint-initdb.d/multiple-databases.sh
    networks:
      - main
    labels:
      - "layer=data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  db_data:
